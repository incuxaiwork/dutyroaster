
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AP Police Duty Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F2F8;--bg2:#E8EAF2;--surface:#FFFFFF;--surface2:#F7F8FC;
  --border:#E4E7F0;--border2:#D4D8E8;
  --text1:#12152A;--text2:#485070;--text3:#8892B0;
  --blue:#2563EB;--blue-lt:#EEF3FF;--blue-md:#C7D6FF;
  --grn:#15A34A;--grn-lt:#EDFAF3;--grn-md:#A7F3C8;
  --red:#DC2626;--red-lt:#FEF2F2;--red-md:#FECACA;
  --org:#D97706;--org-lt:#FFFBEB;--org-md:#FDE68A;
  --gap:20px;
  --shadow:0 1px 4px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.03);
  --shadow-md:0 6px 20px rgba(0,0,0,.07),0 2px 6px rgba(0,0,0,.04);
  --radius:12px;
}
html,body{height:100%;background:var(--bg);color:var(--text1);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5}
#root{height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* TOPBAR */
.topbar{height:64px;min-height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tb-brand{display:flex;align-items:center;gap:14px}
.tb-logo{width:52px;height:52px;border-radius:10px;overflow:hidden;border:none;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.tb-logo img{width:100%;height:100%;object-fit:contain}
.tb-title{font-size:15px;font-weight:800;color:var(--text1);letter-spacing:-.3px;line-height:1.2}
.tb-subtitle{font-size:11.5px;color:var(--text3);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:12px}
.clock{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;letter-spacing:1.5px}
.tb-btn{padding:9px 22px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px;background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.28)}
.tb-btn:hover{background:#1d4ed8}
.tb-btn:disabled{opacity:.5;cursor:not-allowed}

/* BODY */
.app-body{flex:1;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{width:206px;min-width:206px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20}
.sb-section{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1.8px;text-transform:uppercase;padding:20px 16px 8px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:all .13s;color:var(--text3);font-size:13.5px;font-weight:500;margin:1px 8px;user-select:none}
.ni:hover{background:var(--bg);color:var(--text1)}
.ni.on{background:var(--blue-lt);color:var(--blue);font-weight:700}
.ni-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.ni-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px}
.sb-footer{padding:12px 8px;border-top:1px solid var(--border);margin-top:auto}
.sa-wrap{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;background:var(--surface2);border:1px solid var(--border)}
.sa-av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563EB,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;font-weight:800}
.sa-name{font-size:12.5px;font-weight:700;color:var(--text1)}
.sa-role{font-size:10.5px;color:var(--text3)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pulse 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pg-header{padding:18px 28px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.pg-crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text3);margin-bottom:4px}
.pg-title{font-size:22px;font-weight:800;color:var(--text1);letter-spacing:-.5px}

/* SCROLL CONTENT */
.content{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:0}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.cp{padding:22px 24px}

/* GRIDS — all use same gap */
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.g2a{display:grid;grid-template-columns:1fr 300px;gap:var(--gap)}

/* PANEL HEADER */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.pt{font-size:14px;font-weight:800;color:var(--text1);display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.pt-bar{width:3px;height:16px;background:var(--blue);border-radius:2px;flex-shrink:0}
.ps{font-size:12px;color:var(--text3);margin-top:2px}

/* STAT CARD */
.sc-lbl{font-size:12.5px;color:var(--text3);font-weight:500;margin-bottom:10px}
.sc-num{font-size:30px;font-weight:800;color:var(--text1);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.sc-sub{font-size:11.5px;color:var(--text3);margin-top:6px}
.sc-trend{font-size:11px;font-weight:700;padding:3px 10px;border-radius:5px;margin-top:12px;display:inline-block}
.tr-up{background:var(--grn-lt);color:var(--grn)}.tr-dn{background:var(--red-lt);color:var(--red)}.tr-nt{background:var(--bg2);color:var(--text3)}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.2)}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg2);color:var(--text1)}
.btn-danger{background:var(--red-lt);color:var(--red);border:1px solid var(--red-md)}.btn-danger:hover{background:var(--red-md)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn-lg{padding:11px 22px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.w100{width:100%}

/* TABLE */
.dt{width:100%;border-collapse:collapse}
.dt th{font-size:11.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface2)}
.dt td{padding:10px 14px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border)}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:var(--surface2)}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px}
.badge-grn{background:var(--grn-lt);color:var(--grn);border:1px solid var(--grn-md)}
.badge-red{background:var(--red-lt);color:var(--red);border:1px solid var(--red-md)}
.badge-org{background:var(--org-lt);color:var(--org);border:1px solid var(--org-md)}
.badge-blue{background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-md)}
.badge-neutral{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}

/* DUTY CHIP */
.dchip{display:inline-flex;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px}
.dc-patrol{background:#EEF3FF;color:#2563EB;border:1px solid #C7D6FF}
.dc-night{background:#F5F3FF;color:#7C3AED;border:1px solid #DDD6FE}
.dc-station{background:#FFFBEB;color:#D97706;border:1px solid #FDE68A}
.dc-emergency{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}

/* PROGRESS */
.pbar-bg{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;transition:width .5s}

/* HEATMAP */
.hm-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hm-name{font-size:13px;color:var(--text1);font-weight:600;width:96px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-bg{flex:1;height:7px;background:var(--bg2);border-radius:3px;overflow:hidden}
.hm-fill{height:100%;border-radius:3px}
.hm-val{font-size:12px;font-weight:700;width:22px;text-align:right;font-family:'JetBrains Mono',monospace}

/* FATIGUE */
.fat-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.fat-row:last-child{border-bottom:none}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-size:11.5px;font-weight:800;width:20px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.lb-name{font-size:13px;font-weight:600;color:var(--text1)}
.lb-score{font-size:13px;font-weight:800;min-width:28px;text-align:right;font-family:'JetBrains Mono',monospace}

/* ALERT */
.al{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:10px;border:1px solid;margin-bottom:10px}
.al:last-child{margin-bottom:0}
.al.al-warn{background:var(--org-lt);border-color:var(--org-md)}
.al.al-err{background:var(--red-lt);border-color:var(--red-md)}
.al.al-info{background:var(--blue-lt);border-color:var(--blue-md)}
.al.al-ok{background:var(--grn-lt);border-color:var(--grn-md)}
.al-ico{font-size:15px;flex-shrink:0;margin-top:1px}
.al-ttl{font-size:13px;font-weight:700;color:var(--text1)}
.al-dsc{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5}
.al-tm{font-size:10.5px;color:var(--text3);margin-top:3px;font-family:'JetBrains Mono',monospace}

/* INSIGHTS */
.ins-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.ins-item:last-child{border-bottom:none;padding-bottom:0}
.ins-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ins-ttl{font-size:13px;font-weight:700;color:var(--text1)}
.ins-sub{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.5}

/* FEED */
.feed-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.feed-item:last-child{border-bottom:none}
.feed-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
.feed-time{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text3);flex-shrink:0;width:38px}
.feed-msg{font-size:12px;color:var(--text2);line-height:1.5}
.feed-msg strong{color:var(--text1);font-weight:700}

/* MAP */
.map-area{background:var(--surface2);border:1px solid var(--border);border-radius:9px;overflow:hidden;position:relative;height:148px}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:24px 24px;opacity:.5}
.map-pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center}
.pin-circle{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid;margin:0 auto}
.pin-label{font-size:8px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.94);border:1px solid var(--border);padding:1px 5px;border-radius:3px;margin-top:2px;color:var(--text1)}

/* SCORE RING */
.sr{position:relative;display:inline-flex;align-items:center;justify-content:center}
.sr svg{transform:rotate(-90deg)}
.sr-text{position:absolute;text-align:center}

/* RADAR */
.radar-wrap{display:flex;align-items:center;justify-content:center;padding:4px 0}

/* TOGGLES */
.tgl{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:2px}
.tgl-b{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text3);transition:all .13s;font-family:'Inter',sans-serif}
.tgl-b.on{background:var(--surface);color:var(--text1);font-weight:700;box-shadow:var(--shadow)}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(10,14,36,.32);backdrop-filter:blur(6px);z-index:400;display:flex;align-items:center;justify-content:center;animation:fadeIn .18s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 48px rgba(0,0,0,.11);animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mttl{font-size:16px;font-weight:800;color:var(--text1)}
.mx{width:30px;height:30px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;transition:all .13s}
.mx:hover{background:var(--red-lt);color:var(--red);border-color:var(--red-md)}
.fg{margin-bottom:16px}
.flbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:7px;display:block}
.fi,.fsel{width:100%;padding:9px 13px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text1);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .13s}
.fi:focus,.fsel:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fsel option{background:var(--surface)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cbg{display:flex;flex-wrap:wrap;gap:6px}
.cbi{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);cursor:pointer;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);transition:all .12s}
.cbi:hover{border-color:var(--blue-md);color:var(--text1)}
.cbi input{accent-color:var(--blue)}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--surface);border:1px solid var(--grn-md);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--grn);font-weight:700;z-index:999;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-md);animation:slideUp .2s ease}

/* LOADING */
.lbar{height:2px;background:linear-gradient(90deg,var(--blue),#60A5FA,var(--blue));background-size:200%;animation:lmv 1.2s linear infinite;flex-shrink:0}
@keyframes lmv{0%{background-position:0%}100%{background-position:200%}}

/* AI THINKING */
.ai-thinking{margin-top:16px;padding:16px;background:var(--blue-lt);border:1px solid var(--blue-md);border-radius:10px}
.ai-step{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px;color:var(--text2)}
.ai-step.done{color:var(--grn)}.ai-step.active{color:var(--blue)}
.step-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.step-dot.done{background:var(--grn)}.step-dot.active{background:var(--blue);animation:pulse 1s infinite}.step-dot.pending{background:var(--border2)}

/* OFFICER CARD */
.oc{padding:18px 20px;cursor:pointer;transition:all .16s}
.oc:hover{border-color:var(--blue-md);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.oc-av{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border)}
.oc-name{font-size:14px;font-weight:800;color:var(--text1)}
.oc-rank{font-size:11.5px;color:var(--text3)}
.oc-badge{font-size:10.5px;color:var(--blue);font-weight:700;font-family:'JetBrains Mono',monospace}

/* POWERED BY */
.powered{padding:20px 0 8px;text-align:center;border-top:2px solid var(--border);margin-top:8px}
.powered-text{font-size:14px;font-weight:700;color:var(--text2);letter-spacing:.2px}
.powered-brand{font-size:15px;font-weight:900;color:#fff;background:var(--blue);border:2px solid #1d4ed8;padding:4px 14px;border-radius:7px;margin-left:6px;letter-spacing:1.2px;box-shadow:0 2px 8px rgba(37,99,235,.3);text-transform:uppercase}

/* UTILS */
.f{display:flex}.aic{align-items:center}.jcb{justify-content:space-between}.jcc{justify-content:center}
.g2u{gap:8px}.g3u{gap:12px}
.tc{text-align:center}.fw7{font-weight:700}.fw8{font-weight:800}
.mono{font-family:'JetBrains Mono',monospace}
.div{height:1px;background:var(--border);margin:14px 0}
.fa{animation:slideUp .22s ease}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:3px;background:var(--bg2);outline:none;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--blue);cursor:pointer}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;

const RANKS=['Constable','Head Constable','Sub-Inspector','Inspector','DSP'];

};
const NAV=[

  {id:'s3',name:'Arjun Reddy',rank:'Constable',badge:'AP-003',avatar:'👮',phone:'9000000003',skills:['Armed','General'],duties:18,nights:9,status:'active'},
  {id:'s4',name:'Meena Devi',rank:'Sub-Inspector',badge:'AP-004',avatar:'👮‍♀️',phone:'9000000004',skills:['Traffic','General'],duties:10,nights:4,status:'active'},
  {id:'s5',name:'Suresh Babu',rank:'Inspector',badge:'AP-005',avatar:'👮',phone:'9000000005',skills:['VIP Security','Armed'],duties:5,nights:1,status:'active'},

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fcC(s){return s>=75?'var(--grn)':s>=50?'var(--org)':'var(--red)'}
function fcL(s){return s>=75?'Balanced':s>=50?'Moderate':'Overloaded'}
function skC(s){return({General:'badge-neutral',Traffic:'badge-blue',Cyber:'badge-blue','VIP Security':'badge-grn',Armed:'badge-org'})[s]||'badge-neutral'}
function fatRisk(f){return f>=75?{l:'Low Risk',c:'var(--grn)',cl:'badge-grn'}:f>=50?{l:'Medium',c:'var(--org)',cl:'badge-org'}:{l:'High Risk',c:'var(--red)',cl:'badge-red'}}
function calcFairness(o,all){const md=Math.max(...all.map(x=>x.duties),1),mn=Math.max(...all.map(x=>x.nights),1);return Math.max(5,Math.min(99,Math.round((100-(o.duties/md)*60+100-(o.nights/mn)*40)/2)))}
function calcFatigue(o){return Math.max(5,Math.min(99,100-Math.round((Math.min(o.nights,14)/14)*50+(Math.min(o.duties,30)/30)*50)))}
function applyScores(list){return list.map(o=>({...o,fairness:calcFairness(o,list),fatigue:calcFatigue(o)}))}
function genRoster(officers,days,dtypes){
  const active=officers.filter(o=>o.status==='active');if(!active.length) return {};
  const wl={};active.forEach(o=>{wl[o.id]={d:0,n:0}});
  const r={};
  days.forEach(day=>{r[day]=[];const used=new Set();dtypes.forEach(duty=>{const cands=active.filter(o=>!used.has(o.id)).sort((a,b)=>{const wa=wl[a.id],wb=wl[b.id];return(wa.d-wb.d)+(duty==='Night Shift'?(wa.n-wb.n)*2:0)});if(!cands.length) return;const c=cands[0];used.add(c.id);wl[c.id].d++;if(duty==='Night Shift') wl[c.id].n++;const m=DMETA[duty];r[day].push({id:uid(),officer:c.name,officerId:c.id,duty,cls:m.cls,icon:m.icon,time:m.time})})});
  return r;
}
function checkConflicts(officers,roster){
  const res=[];
  officers.forEach(o=>{if(o.nights>=7) res.push({id:uid(),type:'al-warn',icon:'⚠️',title:'Night Shift Overload',desc:`${o.name} — ${o.nights} nights. Burnout risk.`,time:'Now'})});
  Object.entries(roster).forEach(([day,duties])=>{const seen={};duties.forEach(d=>{if(seen[d.officerId]) res.push({id:uid(),type:'al-err',icon:'⛔',title:'Double Booking',desc:`${d.officer} assigned twice on ${day}.`,time:'Now'});seen[d.officerId]=true})});
  return res;
}
function buildSummary(officers,roster,conflictsLen){
  const all=Object.values(roster).flat();
  const avg=officers.length?Math.round(officers.reduce((s,o)=>s+o.fairness,0)/officers.length):0;
  return{conflicts:conflictsLen,fairness:avg,balanced:Math.round((officers.filter(o=>o.fairness>=75).length/Math.max(officers.length,1))*100),overloaded:officers.filter(o=>o.fairness<40).length,deployed:new Set(all.map(d=>d.officerId)).size,total:all.length,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
}

function LiveClock(){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
  const pad=n=>String(n).padStart(2,'0');
  return <div className="clock">{pad(now.getHours())}:{pad(now.getMinutes())}:{pad(now.getSeconds())}</div>;
}

function SR({score,size=54}){
  const r=(size-8)/2,c=2*Math.PI*r,fill=(score/100)*c,col=fcC(score);
  return(
    <div className="sr" style={{width:size,height:size}}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg2)" strokeWidth="5"/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth="5" strokeDasharray={`${fill} ${c}`} strokeLinecap="round"/>
      </svg>
      <div className="sr-text"><div style={{color:col,fontSize:14,fontWeight:800,fontFamily:"'JetBrains Mono',monospace"}}>{score}</div></div>
    </div>
  );
}

function RadarChart({officers}){
  const avg=officers.length?Math.round(officers.reduce((s,o)=>s+o.fairness,0)/officers.length):75;
  const metrics=['Nights','Weekend','Workload','Emergency','Rest'];
  const vals=[
    Math.round(100-Math.min(100,(Math.max(...officers.map(o=>o.nights),1)/14)*100)),
    avg,Math.round(100-Math.min(100,(Math.max(...officers.map(o=>o.duties),1)/30)*100)),
    Math.round(avg*.9),Math.round(avg*.95),
  ];
  const cx=85,cy=80,r=58;
  const pts=vals.map((v,i)=>{const a=(i/5)*2*Math.PI-Math.PI/2,rv=(v/100)*r;return{x:cx+rv*Math.cos(a),y:cy+rv*Math.sin(a),lx:cx+(r+15)*Math.cos(a),ly:cy+(r+15)*Math.sin(a)}});
  return(
    <svg width="170" height="160" style={{overflow:'visible'}}>
      {[.2,.4,.6,.8,1].map(s=>{const rpts=[0,1,2,3,4].map(i=>{const a=(i/5)*2*Math.PI-Math.PI/2;return`${cx+r*s*Math.cos(a)},${cy+r*s*Math.sin(a)}`});return<polygon key={s} points={rpts.join(' ')} fill="none" stroke="var(--border)" strokeWidth="1"/>})}
      {[0,1,2,3,4].map(i=>{const a=(i/5)*2*Math.PI-Math.PI/2;return<line key={i} x1={cx} y1={cy} x2={cx+r*Math.cos(a)} y2={cy+r*Math.sin(a)} stroke="var(--border)" strokeWidth="1"/>})}
      <polygon points={pts.map(p=>`${p.x},${p.y}`).join(' ')} fill="rgba(37,99,235,.12)" stroke="var(--blue)" strokeWidth="1.5"/>
      {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="3" fill="var(--blue)"/>)}
      {pts.map((p,i)=><text key={i} x={p.lx} y={p.ly} textAnchor="middle" dominantBaseline="central" style={{fontSize:9,fill:'var(--text3)',fontFamily:"'Inter',sans-serif"}}>{metrics[i]}</text>)}
    </svg>
  );
}

                  <div className="mono" style={{fontSize:17,fontWeight:800,color:'var(--text1)'}}>{v}</div>
                  <div style={{fontSize:10.5,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.5,marginTop:2}}>{l}</div>

/* ══ EMERGENCY ══ */
function EmergencyPage({officers,setOfficers,roster,setRoster,addAlert}){
  const [absent,setAbsent]=useState([]);
  const [loading,setLoading]=useState(false);
  const [repl,setRepl]=useState(null);
  function toggleAbsent(id){setAbsent(prev=>{const isNow=!prev.includes(id);const next=isNow?[...prev,id]:prev.filter(x=>x!==id);setOfficers(applyScores(officers.map(o=>o.id===id?{...o,status:isNow?'leave':'active'}:o)));return next;});setRepl(null);}
  function trigger(){
    if(!roster||!Object.keys(roster).length){addAlert({id:uid(),type:'al-info',icon:'ℹ️',title:'No Roster',desc:'Generate a roster first.',time:'Now'});return;}
    setLoading(true);setRepl(null);
    setTimeout(()=>{
      const avail=officers.filter(o=>!absent.includes(o.id)&&o.status==='active');
      if(!avail.length){setLoading(false);setRepl('none');return;}
      const best=[...avail].sort((a,b)=>b.fairness-a.fairness)[0];
      setRepl(best);
      if(absent.length>0){const abN=officers.filter(o=>absent.includes(o.id)).map(o=>o.name);setRoster(r=>{const nr={};Object.entries(r).forEach(([d,duties])=>{nr[d]=duties.map(x=>abN.includes(x.officer)?{...x,officer:best.name,officerId:best.id}:x)});return nr;});}
      addAlert({id:uid(),type:'al-ok',icon:'✅',title:'Emergency Reassignment',desc:`${best.name} assigned to cover ${absent.length} slot(s).`,time:'Now'});
      setLoading(false);
    },1600);
  }
  const stBadge=s=>s==='active'?'badge-grn':s==='leave'?'badge-org':'badge-neutral';
  const stLabel=s=>s==='active'?'Active':s==='leave'?'Leave':'Off';
  return(
    <div className="fa">
      <div style={{marginBottom:20}}><div className="pt"><div className="pt-bar"/>Emergency Control</div><div className="ps">Real-time officer reassignment</div></div>
      <div className="g2" style={{gap:20}}>
        <div className="card cp">
          <div className="pt" style={{marginBottom:18}}><div className="pt-bar"/>Mark Officers Absent</div>
          {officers.map(o=>(
            <div key={o.id} className="f aic g3u" style={{padding:'11px 0',borderBottom:'1px solid var(--border)'}}>
              <span style={{fontSize:20}}>{o.avatar}</span>
              <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:'var(--text1)'}}>{o.name}</div><div style={{fontSize:12,color:'var(--text3)'}}>{o.rank} · {o.badge}</div></div>
              <span className={`badge ${stBadge(o.status)}`}>{stLabel(o.status)}</span>
              <button className={`btn btn-sm ${absent.includes(o.id)?'btn-primary':'btn-secondary'}`} onClick={()=>toggleAbsent(o.id)}>{absent.includes(o.id)?'✓ Marked':'Mark Absent'}</button>
            </div>
          ))}
          {absent.length>0&&<div className="al al-warn" style={{marginTop:16}}><div className="al-ico">⚠️</div><div><div className="al-ttl">{absent.length} officer(s) marked absent</div><div className="al-dsc">Click Emergency Reassign to patch affected slots</div></div></div>}
        </div>
        <div className="card cp" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center',gap:20,minHeight:320}}>
          <div style={{fontSize:50}}>⚡</div>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:'var(--text1)',marginBottom:8}}>Emergency Override</div>
            <div style={{fontSize:13,color:'var(--text2)',maxWidth:240,lineHeight:1.7}}>Patches affected slots using skill-matching and fairness scoring in real time.</div>
          </div>
          <button className="btn btn-danger btn-lg w100" style={{maxWidth:280}} onClick={trigger} disabled={loading}>{loading?'⏳ Reassigning…':'⚡ Emergency Reassign'}</button>
          {loading&&<div className="lbar" style={{width:'100%',maxWidth:280,borderRadius:3}}/>}
          {repl&&repl!=='none'&&!loading&&(<div className="fa w100" style={{maxWidth:300,textAlign:'left'}}><div className="al al-ok"><div className="al-ico">✅</div><div><div className="al-ttl">Replacement: {repl.name}</div><div className="al-dsc">{repl.rank} · Fairness: {repl.fairness}/100</div></div></div></div>)}
          {repl==='none'&&!loading&&<div className="al al-warn" style={{width:'100%',maxWidth:300,textAlign:'left'}}><div className="al-ico">⚠️</div><div><div className="al-ttl">No officers available</div></div></div>}
        </div>
      </div>
      <PoweredBy/>
    </div>
  );
}

function ExportPage({roster,officers,settings}){
  const rows=Object.entries(roster).flatMap(([day,duties])=>duties.map(d=>({day,...d})));
  function downloadCSV(){
    const header=['Day','Officer','Duty','Time'];
    const csvRows=[header,...rows.map(r=>[r.day,r.officer,r.duty,r.time])];
    const blob=new Blob([csvRows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n')],{type:'text/csv'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='police_duty_roster.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  }
  function printRoster(){
    const stN=(settings&&settings.station)||'Anantapur Police HQ';
    const adN=(settings&&settings.admin)||'DSP';
    const date=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
    const tableRows=rows.map(r=>`<tr><td>${r.day}</td><td>${r.officer}</td><td>${r.duty}</td><td>${r.time}</td></tr>`).join('');
    const html=`<!DOCTYPE html><html><head><title>Duty Order</title><style>body{font-family:Arial;margin:30px;color:#000;font-size:12px}h1{font-size:18px;text-align:center;border-bottom:2px solid #000;padding-bottom:8px}table{width:100%;border-collapse:collapse;margin-bottom:18px}th{background:#1e3a8a;color:#fff;padding:7px 10px;text-align:left;font-size:11px}td{padding:6px 10px;border-bottom:1px solid #ddd;font-size:11px}tr:nth-child(even) td{background:#f5f5f5}</style></head><body><h1>DUTY ORDER — ${stN.toUpperCase()}</h1><p style="margin-bottom:12px;font-size:11px"><strong>Date:</strong> ${date} &nbsp; <strong>Issued by:</strong> ${adN} &nbsp; <strong>Total:</strong> ${rows.length}</p><table><thead><tr><th>Day</th><th>Officer</th><th>Duty</th><th>Time</th></tr></thead><tbody>${tableRows}</tbody></table><p style="font-size:9px;color:#888;margin-top:20px">Generated by INCUXAI · ${date}</p></body></html>`;
    const w=window.open('','_blank','width=900,height=700');w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);
  }
  return(
    <div className="fa">
      <div style={{marginBottom:20}}><div className="pt"><div className="pt-bar"/>Export</div></div>
      <div className="g3" style={{marginBottom:20}}>
        {[{e:'📄',t:'PDF / Print Report',d:'Official duty order for records',fn:printRoster},{e:'📊',t:'CSV Spreadsheet',d:'Download for Excel or Sheets',fn:downloadCSV},{e:'🖨️',t:'Print View',d:'Formatted browser print dialog',fn:printRoster}].map(({e,t,d,fn})=>(
          <div key={t} className="card cp tc" style={{padding:28}}>
            <div style={{fontSize:36,marginBottom:14}}>{e}</div>
            <div style={{fontSize:14,fontWeight:800,marginBottom:6,color:'var(--text1)'}}>{t}</div>
            <div style={{fontSize:12,color:'var(--text3)',marginBottom:18}}>{d}</div>
            <button className="btn btn-primary w100" onClick={fn}>Export</button>
          </div>
        ))}
      </div>
      {rows.length===0&&<div className="card cp tc" style={{padding:'32px 0',color:'var(--text3)',fontSize:13}}>Generate a roster first to enable export</div>}
      {rows.length>0&&<div className="card cp"><div className="pt" style={{marginBottom:16}}><div className="pt-bar"/>Preview ({rows.length} entries)</div><table className="dt"><thead><tr><th>Day</th><th>Officer</th><th>Duty</th><th>Time</th></tr></thead><tbody>{rows.map((d,i)=>(<tr key={i}><td><span className="mono fw8" style={{fontSize:12}}>{d.day}</span></td><td>{d.officer}</td><td><span className={`dchip ${d.cls}`}>{d.duty}</span></td><td><span className="mono">{d.time}</span></td></tr>))}</tbody></table></div>}
      <PoweredBy/>
    </div>
  );
}

  const [summary,setSummary]=useState(null);
  const [toastMsg,setToastMsg]=useState('');
  const [feedMsgs,setFeedMsgs]=useState(FEED_INIT);
  const [settings,setSettings]=useState({restGap:8,maxNights:5,autoFix:true,noBurnout:true,station:'Anantapur Police HQ',admin:'DSP Ramesh Gupta',weekDays:[...DAYS],dutyTypes:[...DTYPES]});

  function addAlert(a){setAlerts(prev=>[a,...prev.slice(0,19)]);}
  function addFeed(msg,dot='#15A34A'){const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});setFeedMsgs(prev=>[{dot,time,msg},...prev.slice(0,8)]);}

  function handleGenerate(){
    const active=officers.filter(o=>o.status==='active');
    if(!active.length){addAlert({id:uid(),type:'al-info',icon:'ℹ️',title:'No Active Officers',desc:'All officers absent.',time:'Now'});return;}
    setGenerating(true);setGenStep(0);
    GEN_STEPS.forEach((_,i)=>{setTimeout(()=>setGenStep(i+1),i*260+260);});
    setTimeout(()=>{
      const newRoster=genRoster(officers,settings.weekDays,settings.dutyTypes||DTYPES);
      setRoster(newRoster);
      const dc={},nc={};officers.forEach(o=>{dc[o.id]=0;nc[o.id]=0;});
      Object.values(newRoster).flat().forEach(d=>{if(dc[d.officerId]!==undefined) dc[d.officerId]++;if(d.duty==='Night Shift'&&nc[d.officerId]!==undefined) nc[d.officerId]++;});
      const updated=applyScores(officers.map(o=>({...o,duties:dc[o.id]>0?dc[o.id]:o.duties,nights:nc[o.id]>0?nc[o.id]:o.nights})));
      setOfficers(updated);
      const conflicts=checkConflicts(updated,newRoster);
      conflicts.forEach(c=>addAlert(c));
      setSummary(buildSummary(updated,newRoster,conflicts.length));
      addAlert({id:uid(),type:'al-ok',icon:'✅',title:'Roster Generated',desc:`${settings.weekDays.length}-day roster. ${conflicts.length} conflict(s).`,time:'Now'});
      addFeed('<strong>Roster generated</strong> — AI optimised');
      setToastMsg('Roster generated successfully');
      setGenerating(false);setGenStep(-1);
    },1700);
  }

  const setOfficersWrapped=useCallback((fn)=>{setOfficers(prev=>{const next=typeof fn==='function'?fn(prev):fn;return applyScores(next);});},[]);
  const pageTitle={dashboard:'Dashboard',officers:'Officers',analytics:'Analytics',emergency:'Emergency',alerts:'Alerts',export:'Export',settings:'Settings'};

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
      <div className="topbar">
        <div className="tb-brand">
          <div className="tb-logo">
            <img src="aplogo.png" alt="AP Police" onError={e=>{e.target.style.display='none';e.target.parentElement.innerHTML='<span style="color:var(--blue);font-size:22px">🛡️</span>';}}/>
          </div>
          <div>
            <div className="tb-title">Andhra Pradesh Police Department</div>
            <div className="tb-subtitle">Smart Duty Intelligence System</div>
          </div>
        </div>
        <div className="tb-right">
          <LiveClock/>
          <button className="tb-btn" onClick={handleGenerate} disabled={generating}>
            {generating?'⏳ Generating…':'⚡ Generate Roster'}
          </button>
        </div>
      </div>

      <div className="app-body">
        <aside className="sidebar">
          <nav style={{padding:'10px 8px',flex:1,overflowY:'auto'}}>
            <div className="sb-section">Main</div>
            {NAV.slice(0,3).map(n=>(<div key={n.id} className={`ni ${page===n.id?'on':''}`} onClick={()=>setPage(n.id)}><span className="ni-icon">{n.i}</span>{n.l}</div>))}
            <div className="sb-section">Operations</div>
            {NAV.slice(3).map(n=>(<div key={n.id} className={`ni ${page===n.id?'on':''}`} onClick={()=>setPage(n.id)}><span className="ni-icon">{n.i}</span>{n.l}{n.badge&&alerts.length>0&&<span className="ni-badge">{alerts.length}</span>}</div>))}
          </nav>
          <div className="sb-footer">
            <div className="sa-wrap">
              <div className="sa-av">R</div>
              <div><div className="sa-name">DSP Ramesh</div><div className="sa-role">Administrator</div></div>
              <div className="live-dot" style={{marginLeft:'auto'}}/>
            </div>
          </div>
        </aside>

        <div className="main">
          {generating&&<div className="lbar"/>}
          <div className="pg-header">
            <div className="pg-crumb"><span>AP Police</span><span>›</span><span style={{color:'var(--text1)',fontWeight:700}}>{pageTitle[page]}</span></div>
            <div className="pg-title">{pageTitle[page]}</div>
          </div>
          <main className="content">
            {page==='dashboard'&&<DashboardPage officers={officers} roster={roster} alerts={alerts} summary={summary} generating={generating} genStep={genStep} onGenerate={handleGenerate} onNav={setPage} feedMsgs={feedMsgs}/>}
            {page==='officers'&&<OfficersPage officers={officers} setOfficers={setOfficersWrapped}/>}
            {page==='analytics'&&<AnalyticsPage officers={officers} roster={roster}/>}
            {page==='emergency'&&<EmergencyPage officers={officers} setOfficers={setOfficersWrapped} roster={roster} setRoster={setRoster} addAlert={addAlert}/>}
            {page==='alerts'&&<AlertsPage alerts={alerts} setAlerts={setAlerts}/>}
            {page==='export'&&<ExportPage roster={roster} officers={officers} settings={settings}/>}
            {page==='settings'&&<SettingsPage settings={settings} setSettings={setSettings}/>}
          </main>
        </div>
      </div>
      {toastMsg&&<Toast msg={toastMsg} onHide={()=>setToastMsg('')}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
